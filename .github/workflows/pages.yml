name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/Lolcode.Web/**'
      - 'src/Lolcode.CodeAnalysis/**'
      - 'src/Lolcode.Runtime/**'
      - 'Directory.Build.props'
      - 'docs/WEB_PLAYGROUND.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publish
        run: dotnet publish src/Lolcode.Web/Lolcode.Web.csproj --configuration Release --output artifacts/lolcode-web

      - name: Prepare static site
        shell: bash
        run: |
          site="artifacts/lolcode-web/wwwroot"
          grep -Fq '<base href="/dotnet-lolcode/" />' "$site/index.html"
          cp "$site/index.html" "$site/404.html"
          test -f "$site/.nojekyll"
          test -f "$site/_framework/blazor.webassembly.js"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: artifacts/lolcode-web/wwwroot
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
