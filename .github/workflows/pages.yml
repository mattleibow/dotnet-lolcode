name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/Lolcode.Web/**'
      - 'src/Lolcode.CodeAnalysis/**'
      - 'src/Lolcode.Runtime/**'
      - 'docs/**'
      - 'samples/**'
      - '.config/dotnet-tools.json'
      - 'Directory.Build.props'
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - 'tests/Lolcode.Docs.Tests/**'
  pull_request:
    paths:
      - 'src/Lolcode.Web/**'
      - 'src/Lolcode.CodeAnalysis/**'
      - 'src/Lolcode.Runtime/**'
      - 'docs/**'
      - 'samples/**'
      - '.config/dotnet-tools.json'
      - 'Directory.Build.props'
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - 'tests/Lolcode.Docs.Tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Restore DocFX
        run: dotnet tool restore

      - name: Build documentation and playground
        run: scripts/build-pages.sh

      - name: Test complete website
        run: scripts/test-pages.sh

      - name: Upload Playwright screenshots
        if: always() && hashFiles('artifacts/playwright/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-screenshots
          path: artifacts/playwright

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-lolcode-pages
          path: docs/_site
          include-hidden-files: true
          retention-days: 14

      - name: Upload deployment artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
