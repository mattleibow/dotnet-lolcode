name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "❌ Release tags must use the vX.Y.Z format."
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack
        run: |
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts/
          echo "📦 Packages:"
          ls -la artifacts/*.nupkg

      - name: Set extension version
        working-directory: editor/vscode-lolcode
        run: |
          node -e 'const fs = require("node:fs"); const package = require("./package.json"); package.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(package, null, 2) + "\n");' "${{ steps.version.outputs.version }}"

      - name: Test and package VS Code extension
        working-directory: editor/vscode-lolcode
        run: |
          npm test
          npx @vscode/vsce package --no-dependencies --out ../../artifacts/vscode-lolcode-${{ steps.version.outputs.version }}.vsix

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          for pkg in artifacts/*.nupkg; do
            echo "📤 Pushing $(basename $pkg)..."
            dotnet nuget push "$pkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.vsix
