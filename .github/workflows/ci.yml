name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate package version
        id: version
        shell: bash
        run: |
          VERSION_PREFIX="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          [ -n "$VERSION_PREFIX" ] || { echo "❌ VersionPrefix is not defined"; exit 1; }

          DATE="$(date -u '+%Y%m%d')"
          REVISION="${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="$VERSION_PREFIX-pr.${{ github.event.pull_request.number }}.$DATE.$REVISION"
          else
            VERSION="$VERSION_PREFIX-ci.$DATE.$REVISION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 CI version: $VERSION"

  test-vscode-extension:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extension assets
        working-directory: editor/vscode-lolcode
        run: npm test

      - name: Set extension version
        working-directory: editor/vscode-lolcode
        run: |
          node -e 'const fs = require("node:fs"); const package = require("./package.json"); package.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(package, null, 2) + "\n");' "${{ needs.version.outputs.version }}"

      - name: Package extension
        working-directory: editor/vscode-lolcode
        run: |
          mkdir -p ../../artifacts
          npx @vscode/vsce package --no-dependencies --out ../../artifacts/vscode-lolcode-${{ needs.version.outputs.version }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ needs.version.outputs.version }}
          path: artifacts/vscode-lolcode-${{ needs.version.outputs.version }}.vsix

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'

      - name: Build samples
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            if dotnet build "$source" --verbosity quiet > /dev/null 2>&1; then
              echo "✅ $source"
            else
              echo "❌ $source"
              dotnet build "$source" 2>&1 | tail -5
              exit 1
            fi
          done < <(find samples -name '*.lol' ! -path 'samples/project-based/*' -print0)

          dotnet build samples/project-based/hello-world/hello-world.lolproj --verbosity quiet

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned lci prerequisites
        run: sudo apt-get update && sudo apt-get install --yes libncurses-dev libreadline-dev

      - name: Build pinned lci
        run: cmake -S externals/lci -B artifacts/lci-build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build artifacts/lci-build --parallel

      - name: Run compatibility corpus on both engines
        env:
          LCI_PATH: ${{ github.workspace }}/artifacts/lci-build/lci
          REQUIRE_LCI: '1'
        run: >-
          dotnet test tests/Lolcode.EndToEnd.Tests/Lolcode.EndToEnd.Tests.csproj
          --logger "trx;LogFileName=compatibility-results.trx"
          --filter "FullyQualifiedName~.CompatibilityCorpusTests.|FullyQualifiedName~.KnownLciDivergenceCompatibilityCorpusTests.|FullyQualifiedName~.PinnedLciConformanceTests.|FullyQualifiedName~.CompatibilityFixtureValidationTests.|FullyQualifiedName~.FixtureFlattenerTests."

      - name: Verify compatibility contracts with autocrlf enabled
        shell: bash
        run: |
          git clone --no-local --recurse-submodules . artifacts/autocrlf-compatibility
          cd artifacts/autocrlf-compatibility
          git config core.autocrlf true
          git config core.eol crlf
          git rm --cached -r . >/dev/null
          git reset --hard HEAD
          LCI_PATH="$PWD/../lci-build/lci" REQUIRE_LCI=1 dotnet test tests/Lolcode.EndToEnd.Tests/Lolcode.EndToEnd.Tests.csproj --filter "FullyQualifiedName~CompatibilityCorpusTests.Pinned_lci_matches_registered_fixture|FullyQualifiedName~CompatibilityFixtureValidationTests|FullyQualifiedName~FixtureFlattenerTests" --logger "console;verbosity=minimal"
          git diff --check

      - name: Upload compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-results
          path: '**/compatibility-results.trx'

  nativeaot-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            extension: ''
          - os: macos-latest
            rid: osx-arm64
            extension: ''
          - os: windows-latest
            rid: win-x64
            extension: '.exe'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify managed and unsupported modes
        shell: bash
        run: |
          OUTPUT=$(dotnet run --project tests/NativeAotFixture/NativeAotFixture.lolproj -c Release)
          [ "$OUTPUT" = "18" ] || { echo "Unexpected managed output: $OUTPUT"; exit 1; }

          if dotnet build tests/NativeAotFixture/NativeAotFixture.lolproj \
              -c Release -r "${{ matrix.rid }}" \
              -p:PublishAot=true -p:LolcodeLibraryResolution=Dynamic \
              > unsupported.log 2>&1; then
            echo "Dynamic NativeAOT build unexpectedly succeeded"
            cat unsupported.log
            exit 1
          fi
          grep -q "LOL3005" unsupported.log

      - name: Publish static provider fixture
        shell: bash
        run: |
          dotnet publish tests/NativeAotFixture/NativeAotFixture.lolproj \
            -c Release -r "${{ matrix.rid }}" \
            -p:PublishAot=true -p:LolcodeRequireSingleBinary=true \
            --self-contained true

          PUBLISH_DIR="tests/NativeAotFixture/bin/Release/net10.0/${{ matrix.rid }}/publish"
          OUTPUT=$("$PUBLISH_DIR/NativeAotFixture${{ matrix.extension }}")
          [ "$OUTPUT" = "18" ] || { echo "Unexpected native output: $OUTPUT"; exit 1; }
          ! find "$PUBLISH_DIR" -maxdepth 1 -type f \
            \( -name '*.dll' -o -name '*.deps.json' -o -name '*.runtimeconfig.json' \) \
            | grep -q .

      - name: Publish and run native Galaxy
        shell: bash
        run: |
          dotnet publish \
            samples/project-based/can-has-galaxy/CanHasGalaxy.Cli/CanHasGalaxy.Cli.lolproj \
            -c Release -r "${{ matrix.rid }}" \
            -p:PublishAot=true -p:LolcodeRequireSingleBinary=true \
            --self-contained true

          PUBLISH_DIR="samples/project-based/can-has-galaxy/CanHasGalaxy.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          RUN_DIR=$(mktemp -d)
          pushd "$RUN_DIR"
          printf 'STATUS\nSAVE\nLOAD\nQUIT\n' \
            | "$GITHUB_WORKSPACE/$PUBLISH_DIR/CanHasGalaxy.Cli${{ matrix.extension }}" \
            > galaxy.out
          grep -q "SAVE OK: can-has-galaxy.save" galaxy.out
          grep -q "LOAD OK." galaxy.out
          grep -q "KTHXBAI, CAPTAIN." galaxy.out
          test -f can-has-galaxy.save
          popd
          ! find "$PUBLISH_DIR" -maxdepth 1 -type f \
            \( -name '*.dll' -o -name '*.deps.json' -o -name '*.runtimeconfig.json' \) \
            | grep -q .

  pack:
    runs-on: ubuntu-latest
    needs: [build-and-test, version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack -c Release -p:Version=${{ needs.version.outputs.version }} -o artifacts/

      - name: Verify packages
        run: |
          echo "📦 Packages:"
          ls -la artifacts/*.nupkg
          expected=(
            Lolcode.CodeAnalysis
            Lolcode.Runtime
            Lolcode.NET.Sdk
            Lolcode.NET.Templates
          )
          actual=$(find artifacts -maxdepth 1 -name '*.nupkg' -printf '%f\n' | sed -E 's/\.[0-9][^ ]*\.nupkg$//' | sort)
          expected_sorted=$(printf '%s\n' "${expected[@]}" | sort)
          [ "$actual" = "$expected_sorted" ] || {
            echo "❌ Unexpected package IDs"; printf 'Actual:\n%s\nExpected:\n%s\n' "$actual" "$expected_sorted"; exit 1;
          }
          SDK_PKG=$(ls artifacts/Lolcode.NET.Sdk.*.nupkg | head -1)
          for provider in String Stdlib Stdio Socks; do
            unzip -l "$SDK_PKG" | grep -q "tools/net10.0/Lolcode.Runtime.$provider.dll" || {
              echo "❌ SDK package is missing bundled provider $provider"; exit 1;
            }
          done
          echo "✅ Pack produced the expected 4 packages and bundled providers"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  test-packages:
    runs-on: ${{ matrix.os }}
    needs: pack
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages/

      - name: Get package version
        id: version
        shell: bash
        run: |
          SDK_PKG=$(ls packages/Lolcode.NET.Sdk.*.nupkg | head -1)
          VERSION=$(basename "$SDK_PKG" | sed 's/Lolcode.NET.Sdk.\(.*\).nupkg/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Install template and create project
          TEMPLATE_PKG=$(ls packages/Lolcode.NET.Templates.*.nupkg | head -1)
          dotnet new install "$TEMPLATE_PKG"
          mkdir -p test-app && cd test-app

          cat > NuGet.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          dotnet new lolconsole -n MyApp

          # Verify version is baked into .lolproj
          echo "Generated .lolproj:"
          cat MyApp/MyApp.lolproj
          grep -q "Lolcode.NET.Sdk/$VERSION" MyApp/MyApp.lolproj || { echo "❌ SDK version not found in .lolproj"; exit 1; }
          echo "✅ Version $VERSION baked into template"

          # Build and run
          dotnet build MyApp/MyApp.lolproj
          OUTPUT=$(dotnet run --project MyApp/MyApp.lolproj)
          [ "$OUTPUT" = "HAI WORLD!" ] || { echo "❌ Unexpected output: $OUTPUT"; exit 1; }
          echo "✅ Template project builds and runs"

          # Source-file template must not contain file-based directives.
          dotnet new lol -n Greeter
          test -f Greeter.lol
          ! grep -q '^#:' Greeter.lol
          ! grep -q '^#!' Greeter.lol
          echo "✅ Source-file template is directive-free"

          # File-based template must contain the directives and run through the packaged SDK.
          dotnet new lolcode -n hello
          test -f hello.lol
          grep -q '^#!/usr/bin/env -S dotnet run --file$' hello.lol
          grep -q "#:sdk Lolcode.NET.Sdk@$VERSION" hello.lol
          OUTPUT=$(dotnet run --file hello.lol)
          [ "$OUTPUT" = "OH HAI!" ] || { echo "❌ Unexpected file-based output: $OUTPUT"; exit 1; }
          echo "✅ File-based template builds and runs"

          # Public code-analysis package restores and exposes the documented API.
          mkdir api-consumer && cd api-consumer
          cat > ApiConsumer.csproj << EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Lolcode.CodeAnalysis" Version="$VERSION" />
            </ItemGroup>
          </Project>
          EOF
          cat > Program.cs << 'EOF'
          using System;
          using Lolcode.CodeAnalysis;
          using Lolcode.CodeAnalysis.Syntax;

          var tree = SyntaxTree.ParseText("HAI 1.2\nVISIBLE \"OH HAI!\"\nKTHXBYE");
          var compilation = LolcodeCompilation.Create(tree);
          if (!compilation.GetDiagnostics().IsEmpty)
              throw new InvalidOperationException("Expected valid LOLCODE source.");

          Console.WriteLine("Code analysis package works.");
          EOF
          OUTPUT=$(dotnet run)
          [ "$OUTPUT" = "Code analysis package works." ] || { echo "❌ Unexpected code-analysis output: $OUTPUT"; exit 1; }
          echo "✅ Code-analysis package restores and runs"
