name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate package version
        id: version
        shell: bash
        run: |
          VERSION_PREFIX="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          [ -n "$VERSION_PREFIX" ] || { echo "❌ VersionPrefix is not defined"; exit 1; }

          DATE="$(date -u '+%Y%m%d')"
          REVISION="${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="$VERSION_PREFIX-pr.${{ github.event.pull_request.number }}.$DATE.$REVISION"
          else
            VERSION="$VERSION_PREFIX-ci.$DATE.$REVISION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 CI version: $VERSION"

  test-vscode-extension:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extension assets
        working-directory: editor/vscode-lolcode
        run: npm test

      - name: Set extension version
        working-directory: editor/vscode-lolcode
        run: |
          node -e 'const fs = require("node:fs"); const package = require("./package.json"); package.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(package, null, 2) + "\n");' "${{ needs.version.outputs.version }}"

      - name: Package extension
        working-directory: editor/vscode-lolcode
        run: |
          mkdir -p ../../artifacts
          npx @vscode/vsce package --no-dependencies --out ../../artifacts/vscode-lolcode-${{ needs.version.outputs.version }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ needs.version.outputs.version }}
          path: artifacts/vscode-lolcode-${{ needs.version.outputs.version }}.vsix

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'

      - name: Build samples
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            if dotnet build "$source" --verbosity quiet > /dev/null 2>&1; then
              echo "✅ $source"
            else
              echo "❌ $source"
              dotnet build "$source" 2>&1 | tail -5
              exit 1
            fi
          done < <(find samples -name '*.lol' ! -path 'samples/project-based/*' -print0)

          dotnet build samples/project-based/hello-world/hello-world.lolproj --verbosity quiet

  pack:
    runs-on: ubuntu-latest
    needs: [build-and-test, version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack -c Release -p:Version=${{ needs.version.outputs.version }} -o artifacts/

      - name: Verify packages
        run: |
          echo "📦 Packages:"
          ls -la artifacts/*.nupkg
          COUNT=$(ls artifacts/*.nupkg | wc -l)
          [ "$COUNT" -eq 4 ] || { echo "❌ Expected 4 packages, got $COUNT"; exit 1; }
          echo "✅ Pack produced 4 packages"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  test-packages:
    runs-on: ${{ matrix.os }}
    needs: pack
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages/

      - name: Get package version
        id: version
        shell: bash
        run: |
          SDK_PKG=$(ls packages/Lolcode.NET.Sdk.*.nupkg | head -1)
          VERSION=$(basename "$SDK_PKG" | sed 's/Lolcode.NET.Sdk.\(.*\).nupkg/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Install template and create project
          TEMPLATE_PKG=$(ls packages/Lolcode.NET.Templates.*.nupkg | head -1)
          dotnet new install "$TEMPLATE_PKG"
          mkdir -p test-app && cd test-app

          cat > NuGet.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          dotnet new lolconsole -n MyApp

          # Verify version is baked into .lolproj
          echo "Generated .lolproj:"
          cat MyApp/MyApp.lolproj
          grep -q "Lolcode.NET.Sdk/$VERSION" MyApp/MyApp.lolproj || { echo "❌ SDK version not found in .lolproj"; exit 1; }
          echo "✅ Version $VERSION baked into template"

          # Build and run
          dotnet build MyApp/MyApp.lolproj
          OUTPUT=$(dotnet run --project MyApp/MyApp.lolproj)
          [ "$OUTPUT" = "HAI WORLD!" ] || { echo "❌ Unexpected output: $OUTPUT"; exit 1; }
          echo "✅ Template project builds and runs"

          # Source-file template must not contain file-based directives.
          dotnet new lol -n Greeter
          test -f Greeter.lol
          ! grep -q '^#:' Greeter.lol
          ! grep -q '^#!' Greeter.lol
          echo "✅ Source-file template is directive-free"

          # File-based template must contain the directives and run through the packaged SDK.
          dotnet new lolcode -n hello
          test -f hello.lol
          grep -q '^#!/usr/bin/env -S dotnet run --file$' hello.lol
          grep -q "#:sdk Lolcode.NET.Sdk@$VERSION" hello.lol
          OUTPUT=$(dotnet run --file hello.lol)
          [ "$OUTPUT" = "OH HAI!" ] || { echo "❌ Unexpected file-based output: $OUTPUT"; exit 1; }
          echo "✅ File-based template builds and runs"

          # Public code-analysis package restores and exposes the documented API.
          mkdir api-consumer && cd api-consumer
          cat > ApiConsumer.csproj << EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Lolcode.CodeAnalysis" Version="$VERSION" />
            </ItemGroup>
          </Project>
          EOF
          cat > Program.cs << 'EOF'
          using System;
          using Lolcode.CodeAnalysis;
          using Lolcode.CodeAnalysis.Syntax;

          var tree = SyntaxTree.ParseText("HAI 1.2\nVISIBLE \"OH HAI!\"\nKTHXBYE");
          var compilation = LolcodeCompilation.Create(tree);
          if (!compilation.GetDiagnostics().IsEmpty)
              throw new InvalidOperationException("Expected valid LOLCODE source.");

          Console.WriteLine("Code analysis package works.");
          EOF
          OUTPUT=$(dotnet run)
          [ "$OUTPUT" = "Code analysis package works." ] || { echo "❌ Unexpected code-analysis output: $OUTPUT"; exit 1; }
          echo "✅ Code-analysis package restores and runs"
